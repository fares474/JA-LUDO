name: FARES LUDO - Build Android and iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform folders
        run: flutter create --platforms=android,ios --org com.faresludo .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fares-ludo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload iOS build output
        uses: actions/upload-artifact@v4
        with:
          name: fares-ludo-ios-unsigned
          path: build/ios/iphoneos/Runner.app
